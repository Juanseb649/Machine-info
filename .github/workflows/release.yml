name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core C tests
        working-directory: native/src
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Flutter tests
        working-directory: app
        run: |
          flutter pub get
          flutter test --reporter expanded

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse app/build/windows/x64/runner/Release "dist/Machine Info"
          Compress-Archive -Path "dist/Machine Info" -DestinationPath dist/MachineInfo-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/MachineInfo-windows-x64.zip

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release
      - name: Package
        run: |
          mkdir -p dist/machine-info
          cp -r app/build/linux/x64/release/bundle/. dist/machine-info/
          tar -C dist -czf dist/MachineInfo-linux-x64.tar.gz machine-info
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/MachineInfo-linux-x64.tar.gz

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release
      - name: Package
        run: |
          mkdir -p dist/dmg
          cp -R app/build/macos/Build/Products/Release/machine_info.app "dist/dmg/Machine Info.app"
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Machine Info" -srcfolder dist/dmg -ov -format UDZO dist/MachineInfo-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/MachineInfo-macos-universal.dmg

  release:
    needs: [windows, linux, macos]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List packages
        run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Machine Info ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: false
